# ⚠️ This is a docker-compose configuration for development purposes ⚠️
#
# For production use, set up an isolated network, password authentication
# and/or mTLS and disable trace logging.
#
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./dev/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  pv2mqtt:
    build: .
    volumes:
      - ./dev/pv2mqtt.docker.toml:/app/pv2mqtt.toml
    depends_on:
      - mosquitto
    environment:
      RUST_LOG: pv2mqtt=trace
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./Cargo.toml
          action: rebuild
        - path: ./Cargo.lock
          action: rebuild
        - path: ./dev/pv2mqtt.docker.toml
          action: sync+restart
          target: /app/pv2mqtt.toml

volumes:
  mosquitto_data:
  mosquitto_log:
